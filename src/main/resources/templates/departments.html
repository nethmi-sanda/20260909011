<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Departments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-government">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Government Training Management</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/}">Dashboard</a>
    </div>
</nav>

<main class="container py-4">
    <div class="page-header mb-4">
        <h1 class="h3 mb-1">Departments</h1>
        <p class="text-secondary mb-0">Add a department and view existing departments.</p>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5 mb-3">Add Department</h2>
                    <form th:action="@{/departments}" th:object="${department}" method="post">
                        <div class="mb-3">
                            <label class="form-label required" for="name">Department Name</label>
                            <input class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" id="name" th:field="*{name}" required>
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>
                        <button class="btn btn-government" type="submit">Add Department</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5 mb-3">Department List</h2>
                    <div class="table-responsive">
                        <table class="table table-striped align-middle mb-0">
                            <thead><tr><th>ID</th><th>Department Name</th></tr></thead>
                            <tbody>
                            <tr th:each="item : ${departments}">
                                <td th:text="${item.id}"></td>
                                <td th:text="${item.name}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(departments)}"><td colspan="2" class="text-center text-secondary">No departments available.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
