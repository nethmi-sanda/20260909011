<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Nomination</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-government">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Government Training Management</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/}">Dashboard</a>
    </div>
</nav>

<main class="container py-4">
    <div class="page-header mb-4">
        <h1 class="h3 mb-1">New Nomination</h1>
        <p class="text-secondary mb-0">Nominate an officer for a selected training programme.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="alert alert-danger" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>
            <div class="card">
                <div class="card-body p-4">
                    <form th:action="@{/nominations/new}" th:object="${nominationRequest}" method="post">
                        <div class="mb-3">
                            <label class="form-label required" for="trainingProgrammeId">Training Programme</label>
                            <select class="form-select" th:classappend="${#fields.hasErrors('trainingProgrammeId')} ? 'is-invalid'" id="trainingProgrammeId" th:field="*{trainingProgrammeId}" required>
                                <option value="">Select a programme</option>
                                <option th:each="item : ${programmes}" th:value="${item.id}" th:text="${item.title + ' - ' + item.trainingDate}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{trainingProgrammeId}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label required" for="officerId">Officer</label>
                            <select class="form-select" th:classappend="${#fields.hasErrors('officerId')} ? 'is-invalid'" id="officerId" th:field="*{officerId}" required>
                                <option value="">Select an officer</option>
                                <option th:each="item : ${officers}" th:value="${item.id}" th:text="${item.employeeNumber + ' - ' + item.fullName}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{officerId}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label required" for="departmentId">Nominating Department</label>
                            <select class="form-select" th:classappend="${#fields.hasErrors('departmentId')} ? 'is-invalid'" id="departmentId" th:field="*{departmentId}" required>
                                <option value="">Select a department</option>
                                <option th:each="item : ${departments}" th:value="${item.id}" th:text="${item.name}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{departmentId}"></div>
                        </div>

                        <button class="btn btn-government" type="submit">Nominate Officer</button>
                        <a class="btn btn-outline-secondary" th:href="@{/nominations}">View Nominations</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
