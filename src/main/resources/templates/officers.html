<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Officers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-government">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Government Training Management</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/}">Dashboard</a>
    </div>
</nav>

<main class="container py-4">
    <div class="page-header mb-4">
        <h1 class="h3 mb-1">Officers</h1>
        <p class="text-secondary mb-0">Register officers and review existing records.</p>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5 mb-3">Add Officer</h2>
                    <form th:action="@{/officers}" th:object="${officer}" method="post">
                        <div class="mb-3">
                            <label class="form-label required" for="employeeNumber">Employee Number</label>
                            <input class="form-control" th:classappend="${#fields.hasErrors('employeeNumber')} ? 'is-invalid'" id="employeeNumber" th:field="*{employeeNumber}" required>
                            <div class="invalid-feedback" th:errors="*{employeeNumber}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label required" for="fullName">Full Name</label>
                            <input class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'" id="fullName" th:field="*{fullName}" required>
                            <div class="invalid-feedback" th:errors="*{fullName}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" id="email" type="email" th:field="*{email}">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label required" for="department">Department</label>
                            <select class="form-select" th:classappend="${#fields.hasErrors('department')} ? 'is-invalid'" id="department" th:field="*{department.id}" required>
                                <option value="">Select a department</option>
                                <option th:each="item : ${departments}" th:value="${item.id}" th:text="${item.name}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{department}"></div>
                        </div>
                        <button class="btn btn-government" type="submit">Add Officer</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5 mb-3">Officer List</h2>
                    <div class="table-responsive">
                        <table class="table table-striped align-middle mb-0">
                            <thead><tr><th>Employee No.</th><th>Name</th><th>Email</th><th>Department</th></tr></thead>
                            <tbody>
                            <tr th:each="item : ${officers}">
                                <td th:text="${item.employeeNumber}"></td>
                                <td th:text="${item.fullName}"></td>
                                <td th:text="${item.email}"></td>
                                <td th:text="${item.department.name}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(officers)}"><td colspan="4" class="text-center text-secondary">No officers available.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
