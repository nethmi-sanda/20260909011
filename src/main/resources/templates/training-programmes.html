<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Training Programmes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-government">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Government Training Management</a>
        <a class="btn btn-outline-light btn-sm" th:href="@{/}">Dashboard</a>
    </div>
</nav>

<main class="container py-4">
    <div class="page-header mb-4">
        <h1 class="h3 mb-1">Training Programmes</h1>
        <p class="text-secondary mb-0">Create programmes and review the training schedule.</p>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5 mb-3">Add Programme</h2>
                    <form th:action="@{/programmes}" th:object="${trainingProgramme}" method="post">
                        <div class="mb-3">
                            <label class="form-label required" for="title">Title</label>
                            <input class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" id="title" th:field="*{title}" required>
                            <div class="invalid-feedback" th:errors="*{title}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label required" for="trainingDate">Training Date</label>
                            <input class="form-control" th:classappend="${#fields.hasErrors('trainingDate')} ? 'is-invalid'" id="trainingDate" type="date" th:field="*{trainingDate}" required>
                            <div class="invalid-feedback" th:errors="*{trainingDate}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="venue">Venue</label>
                            <input class="form-control" id="venue" th:field="*{venue}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="trainerName">Trainer Name</label>
                            <input class="form-control" id="trainerName" th:field="*{trainerName}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label required" for="maxParticipants">Maximum Participants</label>
                            <input class="form-control" th:classappend="${#fields.hasErrors('maxParticipants')} ? 'is-invalid'" id="maxParticipants" type="number" min="1" th:field="*{maxParticipants}" required>
                            <div class="invalid-feedback" th:errors="*{maxParticipants}"></div>
                        </div>
                        <button class="btn btn-government" type="submit">Add Programme</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <h2 class="h5 mb-3">Programme List</h2>
                    <div class="table-responsive">
                        <table class="table table-striped align-middle mb-0">
                            <thead><tr><th>Title</th><th>Date</th><th>Venue</th><th>Trainer</th><th>Capacity</th></tr></thead>
                            <tbody>
                            <tr th:each="item : ${programmes}">
                                <td th:text="${item.title}"></td>
                                <td th:text="${item.trainingDate}"></td>
                                <td th:text="${item.venue}"></td>
                                <td th:text="${item.trainerName}"></td>
                                <td th:text="${item.maxParticipants}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(programmes)}"><td colspan="5" class="text-center text-secondary">No training programmes available.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
